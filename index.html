<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050b12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sandvik Reports">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Sandvik Reports</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:#050b12;color:#fff}body{display:flex;justify-content:center;overscroll-behavior:none}.page{width:min(100%,760px);min-height:100vh;min-height:100dvh;padding:max(24px,env(safe-area-inset-top)) 20px max(28px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;justify-content:center}.logo{display:block;width:min(92%,620px);height:auto;margin:0 auto clamp(28px,7vw,58px)}h1{margin:0 0 clamp(28px,6vw,48px);font-size:clamp(34px,8vw,64px);line-height:1;letter-spacing:.03em;text-align:center}.menu{width:min(100%,520px);display:grid;grid-template-columns:1fr;gap:16px}.btn{display:flex;align-items:center;justify-content:center;min-height:62px;padding:16px 22px;border:1px solid #d7dde4;border-radius:14px;background:linear-gradient(180deg,#fff 0%,#eef2f6 55%,#d5dce4 100%);box-shadow:0 9px 22px rgba(0,0,0,.34),inset 0 1px 0 #fff;color:#0b1118;text-decoration:none;text-align:center;font-size:19px;font-weight:800;letter-spacing:.01em;transition:transform .15s ease,filter .15s ease}.btn:active{transform:translateY(1px);filter:brightness(.95)}.btn:focus-visible{outline:3px solid #42a5ff;outline-offset:4px}.install{margin-top:22px;border:0;border-radius:14px;background:#050b12;color:#fff;padding:8px;display:none;align-items:center;gap:12px;font-weight:800;font-size:16px;cursor:pointer}.install img{width:48px;height:48px;border-radius:12px}.install.show{display:flex}.offline{min-height:18px;margin-top:14px;color:#aeb8c2;font-size:13px;text-align:center}@media(min-width:640px){.menu{grid-template-columns:1fr 1fr}.btn{min-height:72px;font-size:20px}}@media(max-width:360px){.page{padding-left:14px;padding-right:14px}.btn{font-size:17px;min-height:58px}}
.auth-lock{position:fixed;inset:0;z-index:99999;background:#050b12;display:flex;align-items:center;justify-content:center;padding:max(24px,env(safe-area-inset-top)) 20px max(24px,env(safe-area-inset-bottom))}.auth-lock[hidden]{display:none!important}.auth-card{width:min(100%,420px);text-align:center}.auth-icon{width:104px;height:104px;border-radius:22px;margin:0 auto 22px;display:block}.auth-card h2{margin:0 0 10px;font-size:30px}.auth-card p{margin:0 0 22px;color:#b9c2cc}.auth-card label{display:block;text-align:left;font-size:13px;font-weight:800;margin:0 0 7px}.auth-row{display:flex;gap:10px}.auth-row input{min-width:0;flex:1;height:52px;border:1px solid #707984;border-radius:12px;background:#fff;color:#111;padding:0 14px;font-size:18px}.auth-row button{height:52px;border:1px solid #d7dde4;border-radius:12px;background:linear-gradient(180deg,#fff,#d5dce4);color:#0b1118;padding:0 18px;font-weight:900}.auth-error{min-height:20px;margin-top:12px;color:#ff8c8c;font-size:14px}</style>
</head>
<body><div class="auth-lock" id="authLock"><form class="auth-card" id="authForm"><img class="auth-icon" src="icon-192.png" alt="Sandvik"><h2>Sandvik Reports</h2><p>Enter the password to open the report tools on this device.</p><label for="authPassword">Password</label><div class="auth-row"><input id="authPassword" type="password" autocomplete="current-password" required><button type="submit">Unlock</button></div><div class="auth-error" id="authError" aria-live="polite"></div></form></div>
<main class="page">
<img class="logo" src="Sandvik.png" alt="Sandvik">
<h1>REPORTS</h1>
<nav class="menu" aria-label="Report applications">
<a class="btn" href="audit-report.html">Audit</a>
<a class="btn" href="site-visit.html">Site Visit</a>
<a class="btn" href="training-report.html">Training</a>
<a class="btn" href="commissioning-drills.html">Commissioning Drills</a>
</nav>

<div class="offline" id="networkState" aria-live="polite"></div>
</main>
<script>const AUTH_KEY="sandvikReportsUnlocked",AUTH_VALUE="v1-2026",AUTH_PASSWORD="S@ndvikRep2026";const authLock=document.getElementById('authLock'),authForm=document.getElementById('authForm'),authPassword=document.getElementById('authPassword'),authError=document.getElementById('authError');function isAuthorized(){try{return localStorage.getItem(AUTH_KEY)===AUTH_VALUE}catch(e){return false}}function unlockView(){authLock.hidden=true}if(isAuthorized())unlockView();else{authLock.hidden=false;setTimeout(()=>authPassword.focus(),50)}authForm.addEventListener('submit',event=>{event.preventDefault();if(authPassword.value===AUTH_PASSWORD){try{localStorage.setItem(AUTH_KEY,AUTH_VALUE)}catch(e){}authPassword.value='';authError.textContent='';unlockView();const target=sessionStorage.getItem('sandvikReportsTarget');if(target){sessionStorage.removeItem('sandvikReportsTarget');location.href=target}}else{authError.textContent='Incorrect password';authPassword.select()}});
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));}

const networkState=document.getElementById('networkState');function updateNetwork(){networkState.textContent=navigator.onLine?'':'Offline mode'}updateNetwork();addEventListener('online',updateNetwork);addEventListener('offline',updateNetwork);
</script>
</body>
</html>
