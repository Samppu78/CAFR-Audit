<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050b12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sandvik Reports">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Sandvik Reports</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:#050b12;color:#fff}body{display:flex;justify-content:center;overscroll-behavior:none}.page{width:min(100%,760px);min-height:100vh;min-height:100dvh;padding:max(24px,env(safe-area-inset-top)) 20px max(28px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;justify-content:center}.logo{display:block;width:min(92%,620px);height:auto;margin:0 auto clamp(28px,7vw,58px)}h1{margin:0 0 clamp(28px,6vw,48px);font-size:clamp(34px,8vw,64px);line-height:1;letter-spacing:.03em;text-align:center}.menu{width:min(100%,520px);display:grid;grid-template-columns:1fr;gap:16px}.btn{display:flex;align-items:center;justify-content:center;min-height:62px;padding:16px 22px;border:1px solid #d7dde4;border-radius:14px;background:linear-gradient(180deg,#fff 0%,#eef2f6 55%,#d5dce4 100%);box-shadow:0 9px 22px rgba(0,0,0,.34),inset 0 1px 0 #fff;color:#0b1118;text-decoration:none;text-align:center;font-size:19px;font-weight:800;letter-spacing:.01em;transition:transform .15s ease,filter .15s ease}.btn:active{transform:translateY(1px);filter:brightness(.95)}.btn:focus-visible{outline:3px solid #42a5ff;outline-offset:4px}.install{margin-top:22px;border:0;border-radius:14px;background:#050b12;color:#fff;padding:8px;display:none;align-items:center;gap:12px;font-weight:800;font-size:16px;cursor:pointer}.install img{width:48px;height:48px;border-radius:12px}.install.show{display:flex}.offline{min-height:18px;margin-top:14px;color:#aeb8c2;font-size:13px;text-align:center}@media(min-width:640px){.menu{grid-template-columns:1fr 1fr}.btn{min-height:72px;font-size:20px}}@media(max-width:360px){.page{padding-left:14px;padding-right:14px}.btn{font-size:17px;min-height:58px}}
</style>
</head>
<body>
<main class="page">
<img class="logo" src="Sandvik.png" alt="Sandvik">
<h1>REPORTS</h1>
<nav class="menu" aria-label="Report applications">
<a class="btn" href="audit-report.html">Audit</a>
<a class="btn" href="site-visit.html">Site Visit</a>
<a class="btn" href="training-report.html">Training</a>
<a class="btn" href="commissioning-drills.html">Commissioning Drills</a>
</nav>
<button class="install" id="installApp" type="button" aria-label="Install Sandvik Reports"><img src="icon-192.png" alt=""><span>Install Sandvik Reports</span></button>
<div class="offline" id="networkState" aria-live="polite"></div>
</main>
<script>
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));}
let installPrompt=null;const installButton=document.getElementById('installApp');
window.addEventListener('beforeinstallprompt',event=>{event.preventDefault();installPrompt=event;installButton.classList.add('show')});
installButton.addEventListener('click',async()=>{if(!installPrompt)return;installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;installButton.classList.remove('show')});
window.addEventListener('appinstalled',()=>installButton.classList.remove('show'));
const networkState=document.getElementById('networkState');function updateNetwork(){networkState.textContent=navigator.onLine?'':'Offline mode'}updateNetwork();addEventListener('online',updateNetwork);addEventListener('offline',updateNetwork);
</script>
</body>
</html>
