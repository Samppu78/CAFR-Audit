<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>Sandvik Vehicle Pre-Checks</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#ececec;color:#111;font-family:Arial,Helvetica,sans-serif}body{padding:0 0 90px}.top{position:sticky;top:0;z-index:10;background:#050505;border-bottom:2px solid #fff;padding:12px 14px}.topin{max-width:980px;margin:auto;display:grid;grid-template-columns:48px 1fr 48px;align-items:center}.home{width:44px;height:44px;border:1px solid #666;border-radius:10px;background:linear-gradient(#333,#080808);color:#fff;display:grid;place-items:center;text-decoration:none}.brand{text-align:center}.brand img{display:block;width:min(220px,45vw);height:auto;margin:auto;filter:grayscale(1) brightness(0) invert(1)}.brand small{display:block;color:#fff;font-size:10px;font-weight:700;letter-spacing:.11em;margin-top:1px}.wrap{max-width:980px;margin:auto;padding:14px}.sheet{background:#fff;border:2px solid #111;box-shadow:0 2px 12px #0002}.head{display:grid;grid-template-columns:25% 75%;border-bottom:3px solid #111}.logoBox{padding:14px 10px 14px 14px;border-right:2px solid #111;display:flex;align-items:center;justify-content:flex-start;overflow:hidden}.logoBox img{width:214px;max-width:none;filter:grayscale(1)}.titleBox{padding:12px 14px;text-align:center;display:grid;grid-template-columns:minmax(0,1fr) 48px;align-items:center;gap:12px}.titleBox h1{margin:0 0 6px;font-size:27px}.titleBox p{margin:0;font-size:13px}.precheckHome{display:flex;align-items:center;justify-content:flex-end}.precheckHome .home{flex:0 0 44px}.meta{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:3px solid #111}.field{padding:10px;border-right:2px solid #111}.field:last-child{border-right:0}label{display:block;font-size:10px;text-transform:uppercase;font-weight:800;letter-spacing:.05em;margin-bottom:5px}input,textarea{width:100%;border:0;border-bottom:1px solid #111;padding:6px 2px;background:transparent;font-size:16px;outline:none}textarea{border:1px solid #111;min-height:78px;padding:8px;resize:vertical}.checks{display:grid;grid-template-columns:1fr 1fr}.checkTable:first-child{border-right:2px solid #111}.row,.th{display:grid;grid-template-columns:36px minmax(0,1fr) 54px 54px;min-height:43px;border-bottom:1px solid #111;font-family:Arial,Helvetica,sans-serif}.th{font-size:11px;font-weight:800;text-align:center;min-height:35px}.row>*,.th>*{display:flex;align-items:center;padding:6px;border-right:0;font-family:Arial,Helvetica,sans-serif}.row>*:last-child,.th>*:last-child{border-right:0}.checkTable{position:relative}.checkTable:before,.checkTable:after{content:"";position:absolute;top:0;bottom:0;width:2px;background:#111;z-index:2;pointer-events:none}.checkTable:before{left:36px}.checkTable:after{right:54px}.checkTable .th{position:relative}.checkTable .th:after{content:"";position:absolute;top:0;bottom:0;right:108px;width:2px;background:#111;z-index:2;pointer-events:none}.checkTable{background-image:linear-gradient(#111,#111);background-size:2px 100%;background-repeat:no-repeat;background-position:calc(100% - 108px) 0}.num,.status{justify-content:center}.item{font-size:12px;font-weight:700}.status input{appearance:none;width:25px;height:25px;border:2px solid #111;border-radius:50%;margin:0;cursor:pointer}.status.good input:checked{background:#111;box-shadow:inset 0 0 0 5px #fff}.status.fault input:checked{background:repeating-linear-gradient(45deg,#111 0 3px,#fff 3px 6px)}.notes{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid #111}.notes.single{grid-template-columns:1fr}.notes.single textarea{min-height:180px}.notes>div{padding:12px}.notes>div:first-child{border-right:1px solid #111}.signatures{display:grid;grid-template-columns:1fr 1fr 1fr;border-top:2px solid #111}.signatures.single{grid-template-columns:1fr}.sig{padding:12px;border-right:1px solid #111;min-height:112px}.sig:last-child{border-right:0}.signaturePreview{font-family:"Segoe Script","Brush Script MT",cursive;font-size:24px;font-style:italic;min-height:35px;border-bottom:1px solid #111;padding:3px 2px}.hint{font-size:10px;color:#555;margin-top:5px}.actions{max-width:980px;margin:12px auto 0;padding:0 14px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.actions button{border:1px solid #222;border-radius:10px;padding:13px;background:#111;color:#fff;font-weight:800}.actions button.light{background:#fff;color:#111}.privacy{text-align:center;font-size:10px;color:#666;margin-top:10px}.printTitle{display:none}
@media(max-width:720px){body{padding-bottom:100px}.wrap{padding:8px}.head{grid-template-columns:35% 65%}.logoBox{border-right:2px solid #111;border-bottom:0;padding:8px}.logoBox img{width:155px}.titleBox{padding:8px;display:flex;flex-direction:column;gap:7px}.precheckHome{font-size:9px;gap:6px}.precheckHome .home{width:38px;height:38px;flex-basis:38px}.titleBox h1{font-size:20px}.meta{grid-template-columns:1fr 1fr}.field:nth-child(2){border-right:0}.field:nth-child(-n+2){border-bottom:1px solid #111}.checks{grid-template-columns:1fr}.checkTable:first-child{border-right:0}.checkTable+.checkTable{border-top:2px solid #111}.row,.th{grid-template-columns:34px minmax(0,1fr) 48px 48px}.checkTable:before{left:34px}.checkTable:after{right:48px}.checkTable .th:after{right:96px}.checkTable{background-position:calc(100% - 96px) 0}.item{font-size:11px}.notes,.signatures{grid-template-columns:1fr}.notes>div:first-child,.sig{border-right:0;border-bottom:1px solid #111}.sig:last-child{border-bottom:0}.actions{grid-template-columns:1fr 1fr}.actions button:last-child{grid-column:1/-1}}
@media print{body{background:#fff;padding:0}.top,.actions,.privacy,.precheckHome .home{display:none!important}.wrap{padding:0;max-width:none}.sheet{box-shadow:none;border:1.5px solid #000}.head{grid-template-columns:25% 75%}.logoBox img{width:175px}.titleBox h1{font-size:20px}.checks{grid-template-columns:1fr 1fr}.checkTable:first-child{border-right:1.5px solid #000}.row,.th{grid-template-columns:28px minmax(0,1fr) 40px 40px;min-height:31px}.checkTable:before{left:28px}.checkTable:after{right:40px}.checkTable .th:after{right:80px}.checkTable{background-position:calc(100% - 80px) 0}.item{font-size:9px}.row>*,.th>*{padding:3px}.status input{width:18px;height:18px}.meta{grid-template-columns:repeat(4,1fr)}.notes{grid-template-columns:1fr 1fr}.signatures{grid-template-columns:1fr 1fr 1fr}.notes>div:first-child,.sig{border-right:1px solid #000;border-bottom:0}.signaturePreview{font-size:20px}input,textarea{font-size:11px}.sheet{break-inside:avoid}}
</style>
</head>
<body>

<main class="wrap"><section class="sheet">
<div class="head"><div class="logoBox"><img src="Sandvik.png" alt="Sandvik"></div><div class="titleBox"><div class="titleText"><h1>Light Vehicle Pre-Start Check</h1></div><div class="precheckHome"><a class="home" href="index.html" aria-label="Home"><svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 11.2 12 4l9 7.2"/><path d="M5.5 10.2V21h13V10.2"/><path d="M9.5 21v-6h5v6"/></svg></a></div></div></div>
<div class="meta"><div class="field"><label>Date</label><input id="date" type="date"></div><div class="field"><label>Vehicle / LV Number</label><input id="vehicle"></div><div class="field"><label>Kilometer Reading</label><input id="km" inputmode="numeric"></div><div class="field"><label>Site</label><input id="section"></div></div>
<div class="checks"><div class="checkTable"><div class="th"><span>No.</span><span>Item to Check</span><span>Good</span><span>Faulty</span></div><div id="leftChecks"></div></div><div class="checkTable"><div class="th"><span>No.</span><span>Item to Check</span><span>Good</span><span>Faulty</span></div><div id="rightChecks"></div></div></div>
<div class="notes single"><div><label>Comments</label><textarea id="comments" placeholder="Record defects, observations or actions required..."></textarea></div></div>
<div class="signatures single"><div class="sig"><label>Driver Name</label><input id="driverName" placeholder="Type full name"><div class="signaturePreview" id="driverSig"></div><div class="hint">Digital signature is generated from the typed name.</div></div></div>
</section></main>
<div class="actions"><button type="button" id="saveBtn">SAVE DRAFT</button><button class="light" type="button" id="clearBtn">CLEAR</button><button type="button" id="sendBtn">SEND / PDF</button></div><div class="privacy">Draft data is stored only on this device.</div>
<script>
const items=['Check Engine Oil Level','Check Radiator Coolant Level','Check Power Steering Fluid Level','Check Clutch Fluid Level','Check Window Washer Water Level','Inspect All V-Belts','Check Battery and Clamps','Check for Visible Oil Leaks','Inspect All Windows','Inspect All Mirrors','Check All Lights & Indicators','Record Vehicle Body Damage','Inspect Tyre Condition','Inspect Wheel Nuts','Ensure License and Insurance is Valid','Inspect Seat Belt','Test Horn','Check for Warning Signs on Cluster','Test Foot & Hand Brake','Ensure Jack & Wheel Spanners is Available','Ensure Triangles and 1st Aid Kit is Available','Ensure Fire Extinguisher is Inspected & in Order'];
const left=document.getElementById('leftChecks'),right=document.getElementById('rightChecks');
function row(item,i){const n=i+1;return `<div class="row"><span class="num">${n}</span><span class="item">${item}</span><label class="status good"><input type="radio" name="check${n}" value="good" aria-label="${item} good"></label><label class="status fault"><input type="radio" name="check${n}" value="faulty" aria-label="${item} faulty"></label></div>`};
items.slice(0,11).forEach((x,i)=>left.insertAdjacentHTML('beforeend',row(x,i)));items.slice(11).forEach((x,i)=>right.insertAdjacentHTML('beforeend',row(x,i+11)));
const ids=['date','vehicle','km','section','comments','driverName'];const KEY='sandvikVehiclePreCheckDraft';
function syncSig(){driverSig.textContent=driverName.value}driverName.oninput=syncSig;
function data(){const v={};ids.forEach(id=>v[id]=document.getElementById(id).value);v.checkDate=new Date().toISOString().slice(0,10);v.checks={};document.querySelectorAll('input[type=radio]:checked').forEach(el=>v.checks[el.name]=el.value);return v}
function restore(){try{const v=JSON.parse(localStorage.getItem(KEY)||'null');if(!v)return;ids.forEach(id=>document.getElementById(id).value=v[id]||'');const today=new Date().toISOString().slice(0,10);if(v.checkDate===today){Object.entries(v.checks||{}).forEach(([n,val])=>{const e=document.querySelector(`input[name="${n}"][value="${val}"]`);if(e)e.checked=true})}else{v.checks={};v.comments='';v.km='';v.date=today;v.checkDate=today;localStorage.setItem(KEY,JSON.stringify(v));date.value=today;comments.value='';km.value=''}syncSig()}catch(e){}}
function save(){localStorage.setItem(KEY,JSON.stringify(data()));alert('Draft saved on this device.')}saveBtn.onclick=save;clearBtn.onclick=()=>{if(confirm('Clear this pre-check?')){const keepDriver=driverName.value,keepVehicle=vehicle.value,keepSite=section.value;document.querySelectorAll('input[type=radio]').forEach(e=>e.checked=false);date.value=new Date().toISOString().slice(0,10);km.value='';comments.value='';driverName.value=keepDriver;vehicle.value=keepVehicle;section.value=keepSite;syncSig();localStorage.setItem(KEY,JSON.stringify(data()))}};sendBtn.onclick=()=>{localStorage.setItem(KEY,JSON.stringify(data()));window.print()};ids.forEach(id=>document.getElementById(id).addEventListener('input',()=>localStorage.setItem(KEY,JSON.stringify(data()))));document.addEventListener('change',e=>{if(e.target.matches('input[type=radio]'))localStorage.setItem(KEY,JSON.stringify(data()))});
let radioWasChecked=false;document.addEventListener('pointerdown',e=>{if(e.target.matches('input[type=radio]'))radioWasChecked=e.target.checked});document.addEventListener('click',e=>{if(e.target.matches('input[type=radio]')&&radioWasChecked){e.target.checked=false;radioWasChecked=false;localStorage.setItem(KEY,JSON.stringify(data()))}});
restore();if(!date.value)date.value=new Date().toISOString().slice(0,10);
</script>
</body></html>
